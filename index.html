<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>かんたんXML公文書ビューア</title>
    <link rel="stylesheet" href="style.css">
    <!-- PDF品質を最優先するため、jsPDF + html2canvas を使用 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <header>
        <h1>かんたんXML公文書ビューア</h1>
        <p>ZIP形式（XML+XSL）の公文書ファイルをブラウザで表示・変換します。</p>
    </header>

    <main>
        <div id="upload-container">
            <!-- ファイル選択UIはこの中に表示されます -->
        </div>

        <div id="viewer-section" class="hidden">
             <div id="controls">
                <button id="download-pdf">📄 PDFでダウンロード</button>
                <button id="download-png">🖼️ PNGで保存 (1ページ目のみ)</button>
            </div>
            <div id="viewer-wrapper">
                <div id="viewer">
                    <!-- 変換結果はここに表示されます -->
                </div>
            </div>
        </div>

        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>処理中です...</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Your Name or Company. Powered by Google Gemini.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
